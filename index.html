<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Pêcheur de l'Océan · Commandes</title>
<meta name="theme-color" content="#0b3954">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Commandes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f3f7fa,#0a141b);--card:light-dark(#ffffff,#101e28);--card2:light-dark(#f7fafc,#0d1922);
--ink:light-dark(#0f2533,#e7f1f6);--mute:light-dark(#617986,#8fa6b3);--line:light-dark(#dfe9ef,#1d303c);
--ocean:#0b3954;--ocean2:#082a3f;--sea:light-dark(#0f6da3,#4fb3e8);--seabg:light-dark(#e6f2f9,#12293a);
--lob:light-dark(#e4572e,#ff7b57);--lobbg:light-dark(#fdece7,#3a1d16);
--amb:light-dark(#a86b00,#f2b84b);--ambbg:light-dark(#fdf3df,#33270f);
--ok:light-dark(#1b8158,#5ed29c);--okbg:light-dark(#e3f4ec,#123426);
--sh:0 1px 2px rgb(15 37 51/.06),0 4px 14px rgb(15 37 51/.06);--sh2:0 10px 40px rgb(8 30 45/.22);
--r:14px;--tab:64px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea)}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* structure */
.side{display:none}
.top{position:sticky;top:0;z-index:6;background:var(--ocean);color:#fff;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
.top .in{display:flex;align-items:center;gap:12px;max-width:1280px;margin:auto}
.logo{width:38px;height:38px;border-radius:10px;flex:none}
.top h1{margin:0;font-size:17px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.top h1 small{display:block;font-size:12.5px;font-weight:500;opacity:.75;letter-spacing:0}
.top .sp{flex:1}
.sync{display:flex;align-items:center;gap:7px;font-size:12.5px;opacity:.9;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#f2b84b;box-shadow:0 0 0 3px rgb(242 184 75/.2)}.dot.on{background:#5ed29c;box-shadow:0 0 0 3px rgb(94 210 156/.2)}.dot.off{background:#ff7b57;box-shadow:0 0 0 3px rgb(255 123 87/.2)}
.ghostw{background:rgb(255 255 255/.1);border:1px solid rgb(255 255 255/.18);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
.top .new{display:none}
main{max-width:1280px;margin:auto;padding:18px max(16px,env(safe-area-inset-right)) calc(var(--tab) + 96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tab);text-decoration:none;color:var(--mute);font-size:11px;font-weight:600}
.tabbar a.on{color:var(--sea)}
.tabbar a.on svg{stroke-width:2.4}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(var(--tab) + 14px + env(safe-area-inset-bottom));z-index:7;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--lob);color:#fff;font-weight:700;font-size:15.5px;padding:15px 22px 15px 18px;box-shadow:0 8px 24px rgb(228 87 46/.38)}
.fab svg{stroke-width:2.6}
@media(min-width:960px){
 body{display:grid;grid-template-columns:252px minmax(0,1fr)}
 .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--ocean);color:#fff;padding:22px 14px 18px}
 .side .brand{display:flex;gap:12px;align-items:center;padding:0 8px 22px}
 .side .brand b{font-size:16px;line-height:1.2;font-weight:800}.side .brand small{display:block;font-size:12.5px;opacity:.7;font-weight:500}
 .side nav{display:grid;gap:4px}
 .side nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:rgb(255 255 255/.78);text-decoration:none;font-weight:600}
 .side nav a:hover{background:rgb(255 255 255/.07);color:#fff}
 .side nav a.on{background:rgb(255 255 255/.13);color:#fff}
 .side .foot{margin-top:auto;display:grid;gap:10px;padding:0 8px}
 .tabbar,.fab,.top .brandm,.top .sync{display:none}
 .top{background:transparent;color:var(--ink);position:sticky;padding:20px 32px 6px;background:var(--bg)}
 .top h1{font-size:24px}.top h1 small{color:var(--mute);opacity:1;font-size:13.5px}
 .top .new{display:flex}
 main{padding:12px 32px 60px}
}

/* éléments */
h2{font-size:21px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;min-height:46px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:var(--sh)}
.chip small{font-weight:700;font-size:12px;background:var(--seabg);color:var(--sea);border-radius:999px;padding:1px 8px}
.chip.on{background:var(--sea);border-color:var(--sea);color:#fff}.chip.on small{background:rgb(255 255 255/.22);color:#fff}
.chip.light{box-shadow:none;min-height:38px;padding:6px 12px;font-weight:600;font-size:13.5px;border-radius:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;min-height:46px;font-weight:700;background:var(--seabg);color:var(--sea);text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--lob);color:#fff;box-shadow:0 4px 14px rgb(228 87 46/.25)}
.btn.blue{background:var(--sea);color:#fff}
.btn.out{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.sm{min-height:38px;padding:7px 13px;font-size:13.5px;border-radius:10px}
.btn.danger{background:transparent;color:var(--lob);border:1px solid color-mix(in srgb,var(--lob) 35%,transparent)}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:46px;font-size:16px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--sea);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--sea) 18%,transparent)}
label,.lbl{font-size:13px;font-weight:700;color:var(--mute);display:block;margin:0 0 6px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;min-height:40px;font-weight:700;font-size:13.5px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.seg.plat button.on[data-v=PLATEAU],.seg.plat button.on[data-mode=PLATEAU]{color:var(--sea)}
.seg.plat button.on[data-v=EMBALLAGE],.seg.plat button.on[data-mode=EMBALLAGE]{color:var(--amb)}
.search{position:relative;flex:1 1 260px}.search svg{position:absolute;left:13px;top:13px;color:var(--mute)}.search input{padding-left:42px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.note{background:var(--ambbg);color:var(--amb);border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:600;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:6px 0 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--mute);font-weight:600}
.kpi.w b{color:var(--amb)}.kpi.g b{color:var(--ok)}
.prog{height:8px;background:var(--seabg);border-radius:99px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters .seg{flex:1 1 auto}

/* tickets */
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.tk{position:relative;display:grid;grid-template-columns:70px minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tk:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgb(15 37 51/.06),0 10px 26px rgb(15 37 51/.1)}
.tk .stub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--seabg);color:var(--sea);position:relative;padding:12px 4px}
.tk .stub::after{content:"";position:absolute;right:-1px;top:8px;bottom:8px;border-right:2px dashed color-mix(in srgb,var(--sea) 30%,transparent)}
.tk .stub small{font-size:11px;font-weight:700;opacity:.8}.tk .stub b{font-size:24px;line-height:1;font-weight:800;letter-spacing:-.02em}
.tk.EMBALLAGE .stub{background:var(--ambbg);color:var(--amb)}.tk.EMBALLAGE .stub::after{border-color:color-mix(in srgb,var(--amb) 35%,transparent)}
.tk .bd{padding:12px 14px;display:grid;gap:7px}
.tk .r1{display:flex;align-items:center;gap:8px}
.tk .time{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
.tk h3{margin:0;font-size:16.5px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.tk .ct{margin:0;font-size:13.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tk .r3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute);font-weight:600}
.tk .r3 b{color:var(--ink)}
.tk .r3 .btn{margin-left:auto}
.tk.retire{opacity:.6}.tk.retire h3{text-decoration:line-through}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--seabg);color:var(--sea)}
.pill.attente{background:var(--lobbg);color:var(--lob)}.pill.prepare{background:var(--okbg);color:var(--ok)}.pill.retire{background:var(--card2);color:var(--mute)}
.pill.EMBALLAGE{background:var(--ambbg);color:var(--amb)}.pill.paid{background:var(--okbg);color:var(--ok)}
.flag{font-size:12px;font-weight:700;color:var(--amb)}

/* planning */
.hours{display:grid;gap:10px}
.hr{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.hr .t{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.hr .t small{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-top:4px;letter-spacing:0}
.hbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--card2);margin:8px 0 10px}
.hbar i{display:block;height:100%}.hbar .p{background:var(--sea)}.hbar .e{background:var(--amb)}
.hot{color:var(--lob);font-size:12px;font-weight:800}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:6px 10px;font-size:13px;min-height:38px;font-weight:600}
.mini button i{width:8px;height:8px;border-radius:50%;background:var(--lob)}.mini button.prepare i{background:var(--ok)}.mini button.retire{opacity:.5;text-decoration:line-through}.mini button.retire i{background:var(--mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);font-weight:600;margin:0 0 14px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* préparation */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--mute);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .cat td{background:var(--card2);font-weight:800;color:var(--sea);font-size:13px;padding:8px 14px}
.tbl .big{font-weight:800;font-size:15px}
.tbl .ly{color:var(--mute);font-size:13px}
.tbl small{display:block;color:var(--mute);font-size:12.5px;font-weight:500}

/* produits */
.pgroup{margin-bottom:14px}
.pgroup h3{margin:0;padding:12px 16px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1.7fr) auto minmax(0,1.2fr) minmax(0,.9fr) 40px;gap:10px;align-items:end;padding:10px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow label{font-size:11.5px;margin-bottom:4px}
.prow input,.prow select{min-height:42px;padding:8px 10px}
.ugrp{display:flex;gap:4px}
.ugrp button{border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:0 10px;min-height:42px;font-size:13px;font-weight:700;color:var(--mute)}
.ugrp button.on{background:var(--seabg);border-color:var(--sea);color:var(--sea)}
.pp{display:flex;gap:4px}.pp input{flex:1 1 0;min-width:56px;padding:8px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}.pp select{flex:0 0 64px;width:64px;padding:8px 2px 8px 6px}
.x{border:0;background:transparent;color:var(--mute);border-radius:10px;min-height:42px;display:flex;align-items:center;justify-content:center}
.x:hover{color:var(--lob);background:var(--lobbg)}

/* imprimer */
.pcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.pcard{padding:18px;display:grid;gap:10px;align-content:start}
.pcard .ic{width:44px;height:44px;border-radius:12px;background:var(--seabg);color:var(--sea);display:flex;align-items:center;justify-content:center}
.pcard b{font-size:16px}.pcard p{margin:0;color:var(--mute);font-size:13.5px}

/* tiroir commande */
.scrim{position:fixed;inset:0;z-index:20;background:rgb(6 22 33/.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:21;width:min(600px,100%);background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh2)}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:18px;flex:1}
.db{flex:1;overflow-y:auto;padding:18px;display:grid;gap:18px;align-content:start;-webkit-overflow-scrolling:touch}
.df{padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.df .tot{flex:1;line-height:1.25}.df .tot span{font-size:12.5px;color:var(--mute);font-weight:600;display:block}.df .tot b{font-size:20px;font-weight:800}
.sec{display:grid;gap:12px}
.sec>.lbl{margin:0;font-size:12px;text-transform:none;color:var(--mute)}
.g3{display:grid;grid-template-columns:110px minmax(0,1.4fr) minmax(0,1fr);gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.days button{border:1px solid var(--line);background:var(--card);border-radius:11px;min-height:52px;padding:4px;font-weight:700;font-size:13px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center}
.days button small{font-size:11px;font-weight:600;color:var(--mute)}
.days button.on{background:var(--sea);border-color:var(--sea);color:#fff}.days button.on small{color:rgb(255 255 255/.8)}
.lines{display:grid;gap:8px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.ln .nm{font-weight:700;font-size:14.5px;line-height:1.25}.ln .nm small{display:block;color:var(--mute);font-weight:600;font-size:12px}
.step{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:11px}
.step button{border:0;background:transparent;width:38px;height:42px;font-size:20px;font-weight:700;color:var(--sea);display:flex;align-items:center;justify-content:center}
.step input{border:0;background:transparent;width:58px;min-height:42px;padding:0 2px;text-align:center;font-weight:800;font-size:16px;box-shadow:none}
.step select{border:0;background:transparent;width:auto;min-height:42px;padding:0 4px;font-size:13px;font-weight:700;color:var(--mute);box-shadow:none}
.step .u{font-size:13px;font-weight:700;color:var(--mute);padding-right:4px}
.adder{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.adder .chips{padding-bottom:2px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips button{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:600;min-height:40px}
.pchips button:active{background:var(--seabg)}
.pchips button.has{border-color:var(--sea);color:var(--sea);background:var(--seabg)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:52px;font-weight:600;cursor:pointer;margin:0;color:var(--ink);font-size:14.5px}
.tog input{appearance:none;-webkit-appearance:none;width:46px;height:28px;min-height:0;border-radius:99px;background:var(--line);position:relative;border:0;padding:0;flex:none;cursor:pointer;transition:background .2s}
.tog input::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform .2s}
.tog input:checked{background:var(--ok)}.tog input:checked::after{transform:translateX(18px)}
.sumbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:5px;font-size:14px}
.sumbox div{display:flex;justify-content:space-between;gap:10px}
.sumbox .tt{border-top:1px solid var(--line);padding-top:7px;margin-top:3px;font-weight:800;font-size:16px}
.warn{font-size:12.5px;color:var(--amb);font-weight:600}
.dlgw{position:fixed;inset:0;z-index:40;background:rgb(6 22 33/.5);display:none;align-items:center;justify-content:center;padding:20px}
.dlgw.open{display:flex}

.login{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 80% at 20% 0%,#15608c 0%,#0b3954 45%,#061d2c 100%);display:none;align-items:center;justify-content:center;padding:24px}

.login form{background:var(--card);border-radius:22px;padding:28px 24px;width:min(400px,100%);display:grid;gap:14px;box-shadow:0 30px 80px rgb(0 0 0/.35)}

.login h2{margin:4px 0 0;font-size:22px}.login p{margin:0;color:var(--mute);font-size:14px}

function grams(l){const q=+l.qte||0;if(l.unite==='g')return q;const w=W(l);return w?q*(l.unite==='dz'?12:1)*w:null}
function pieces(l){const q=+l.qte||0;if(l.unite==='pc')return q;if(l.unite==='dz')return q*12;const w=W(l);return w?q/w:null}
function linePrice(l){const p=prods[l.pid];const pr=p&&+p.prix;if(!pr)return null;
 if(p.prixPar==='kg'){const g=grams(l);return g==null?null:g/1000*pr}
 const pc=pieces(l);return pc==null?null:p.prixPar==='dz'?pc/12*pr:pc*pr}
function totals(o){let t=0,miss=0;const ls=o.lignes||[];ls.forEach(l=>{const v=linePrice(l);v==null?miss++:t+=v});
 const cons=o.consigne?(+o.consigneMontant||0):0,ac=+o.acompte||0;return{t,miss,n:ls.length,cons,ac,paid:!!o.paye,reste:o.paye?0:t+cons-ac}}
const contentTxt=o=>(o.lignes||[]).map(l=>`${fmtQ(l.qte,l.unite)} ${pname(l)}`).join(' · ');
const sortO=a=>a.slice().sort((x,y)=>(x.heure||'99').localeCompare(y.heure||'99')||(+x.num||0)-(+y.num||0));
const plist=()=>Object.entries(prods).map(([id,p])=>({id,...p})).sort((a,b)=>(CATS.indexOf(a.cat)+1||99)-(CATS.indexOf(b.cat)+1||99)||(a.ordre??999)-(b.ordre??999)||String(a.nom).localeCompare(b.nom));
const unitsOf=pid=>{const u=prods[pid]?.unites;return u&&u.length?u:['pc','g']};

/* vue commandes */

 let list=qq?orders.filter(o=>[o.num,o.nom,o.tel].join('|').toLowerCase().replace(/\s/g,'').includes(qq)):ofDay.filter(o=>(stat==='tous'||o.statut===stat)&&(mode==='tous'||o.mode===mode));
 list=sortO(list);
 const c=s=>ofDay.filter(o=>o.statut===s).length,pl=ofDay.filter(o=>o.mode!=='EMBALLAGE').length;
 const done=ofDay.length?Math.round((ofDay.length-c('attente'))/ofDay.length*100):0;
 return `${dayChips(day,'day')}
 <div class="kpis"><div class="kpi"><b class="num">${ofDay.length}</b><span>commandes</span></div><div class="kpi w"><b class="num">${c('attente')}</b><span>à préparer</span></div><div class="kpi g"><b class="num">${c('prepare')}</b><span>prêtes</span></div><div class="kpi"><b class="num">${c('retire')}</b><span>retirées</span></div><div class="kpi"><b class="num">${pl} · ${ofDay.length-pl}</b><span>plateaux · emballages</span><div class="prog" title="${done}% préparées"><i style="width:${done}%"></i></div></div></div>
 <div class="filters"><label class="search"><span class="sr" hidden>Chercher</span>${ic('search')}<input id="q" type="search" placeholder="Nom, téléphone ou n° de ticket" value="${esc(q)}"></label>
 <div class="seg">${['tous','attente','prepare','retire'].map(s=>`<button data-st="${s}" class="${stat===s?'on':''}">${s==='tous'?'Toutes':ST[s]}</button>`).join('')}</div>
 <div class="seg plat">${['tous','PLATEAU','EMBALLAGE'].map(s=>`<button data-mode="${s}" class="${mode===s?'on':''}">${s==='tous'?'Tout':MODES[s]+'s'}</button>`).join('')}</div></div>

 ${list.length?`<div class="list">${list.map(card).join('')}</div>`:emptyOrders(ofDay,qq)}`}
function emptyOrders(ofDay,qq){

function card(o){const t=totals(o);
 const money=t.paid?'<span class="pill paid">Payé</span>':t.n&&!t.miss?`<span>Reste <b class="num">${eur(t.reste)}</b></span>`:'';
 const nxt={attente:'Prêt',prepare:'Retiré',retire:'Annuler'}[o.statut];
 return `<article class="tk ${o.mode==='EMBALLAGE'?'EMBALLAGE':'PLATEAU'} ${o.statut}" data-open="${o.id}">
 <div class="stub"><small>N°</small><b class="num">${esc(o.num||'?')}</b></div>
 <div class="bd"><div class="r1"><span class="time num">${esc(o.heure||'--:--')}</span><span class="pill ${o.mode==='EMBALLAGE'?'EMBALLAGE':''}">${MODES[o.mode]||'Plateau'}</span><span class="pill ${o.statut}">${ST[o.statut]}</span></div>
 <h3>${esc(o.nom||'Sans nom')}</h3>
 <p class="ct">${esc(contentTxt(o))||'<i>Contenu vide</i>'}</p>
 <div class="r3">${t.ac?`<span>Acompte <b class="num">${eur(t.ac)}</b></span>`:''}${money}${o.consigne?'<span class="flag">Consigne</span>':''}${o.notes?'<span class="flag">Remarque</span>':''}

/* vue planning */

 <div class="row" style="justify-content:space-between;gap:6px"><b>${p} plateau${p>1?'x':''} · ${a.length-p} emballage${a.length-p>1?'s':''}</b><span>${a.length===max&&max>=3?'<span class="hot">Heure de pointe</span> · ':''}<span style="color:var(--mute);font-size:13px;font-weight:600">${rdy}/${a.length} prêtes</span></span></div>
 <div class="hbar"><i class="p" style="width:${p/max*100}%"></i><i class="e" style="width:${(a.length-p)/max*100}%"></i></div>
 <div class="mini">${a.map(o=>`<button class="${o.statut}" data-open="${o.id}"><i></i><span class="num">${esc(o.heure)}</span> N°${esc(o.num)} ${esc(o.nom)}</button>`).join('')}</div></div></div>`}).join('')}</div>`
 :`<div class="empty"><b>Aucun retrait prévu le ${esc(jl(planDay))}</b>Les commandes apparaîtront ici, regroupées par heure.</div>`}`}

/* vue marchandise */
function inventory(dv){const os=orders.filter(o=>dv==='all'||o.jour===dv),inv={};
 os.forEach(o=>(o.lignes||[]).forEach(l=>{const r=inv[l.pid]=inv[l.pid]||{dz:0,pc:0,g:0,ids:new Set(),nom:l.nom};r[l.unite]=(r[l.unite]||0)+(+l.qte||0);r.ids.add(o.id)}));return{os,inv}}
function invMain(r){const p=[];if(r.dz)p.push(frac(r.dz)+' douz.');if(r.pc)p.push(nf(r.pc,1)+' pc');if(r.g)p.push(kgs(r.g));return p.join(' + ')||'—'}
function invSub(r,pid){const w=+(prods[pid]?.poidsPc)||0,s=[];if(r.dz)s.push(nf(r.dz*12,0)+' huîtres');
 if(w&&(r.pc||r.dz))s.push('≈ '+kgs(r.g+(r.pc+r.dz*12)*w)+' au total');return s.join(' · ')}
function lyKey(dv){return dv==='all'?'all':dv.slice(5)}
function vPrep(){
 const {os,inv}=inventory(prepDay),key=lyKey(prepDay),lyn=LYN[key];
 const prepd=os.filter(o=>o.statut!=='attente').length,pct=os.length?Math.round(prepd/os.length*100):0;
 const ids=Object.keys(inv),rowsFor=list=>list.map(id=>{const r=inv[id],ly=LY[id]?.[key];
  return `<tr><td><b>${esc(prods[id]?.nom||r.nom||'?')}</b>${invSub(r,id)?`<small>${invSub(r,id)}</small>`:''}</td><td class="n hide">${r.ids.size}</td><td class="n big">${invMain(r)}</td><td class="n ly">${ly?invMain(ly):'—'}</td></tr>`}).join('');
 let rows='';CATS.forEach(c=>{const l=plist().filter(p=>p.cat===c&&inv[p.id]).map(p=>p.id);if(l.length)rows+=`<tr class="cat"><td colspan="4">${c}</td></tr>`+rowsFor(l)});
 const orphan=ids.filter(id=>!prods[id]);if(orphan.length)rows+=`<tr class="cat"><td colspan="4">Produits retirés du catalogue</td></tr>`+rowsFor(orphan);
 return `${dayChips(prepDay,'prday',true)}
 <div class="kpis"><div class="kpi"><b class="num">${os.length}</b><span>commandes</span></div><div class="kpi g"><b class="num">${prepd}</b><span>préparées</span><div class="prog"><i style="width:${pct}%"></i></div></div><div class="kpi w"><b class="num">${os.length-prepd}</b><span>à préparer</span></div><div class="kpi"><b class="num">${ids.length}</b><span>produits</span></div><div class="kpi"><b class="num">${lyn??'—'}</b><span>commandes l'an dernier</span></div></div>
 ${rows?`<div class="panel" style="overflow:hidden"><table class="tbl"><thead><tr><th>Produit</th><th class="n hide">Cmd</th><th class="n">À prévoir</th><th class="n">L'an dernier</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="row" style="margin-top:14px"><button class="btn out" data-copyinv>${ic('copy')}Copier la liste pour l'envoyer</button></div>`
 :'<div class="empty"><b>Rien à prévoir pour l\'instant</b>Les quantités se calculent toutes seules à partir des commandes.</div>'}
 <p class="sub" style="margin-top:14px">« L'an dernier » vient de ton ancienne application (fêtes 2025, du 23 au 26 décembre). Renseigne le poids moyen d'une pièce dans Produits pour obtenir le total en kilos.</p>`}
function invText(dv){const {os,inv}=inventory(dv);let t=`Le Pêcheur de l'Océan · à prévoir pour ${jl(dv)} (${os.length} commandes)\n`;
 CATS.forEach(c=>{const l=plist().filter(p=>p.cat===c&&inv[p.id]);if(!l.length)return;t+=`\n${c.toUpperCase()}\n`;l.forEach(p=>{const r=inv[p.id],s=invSub(r,p.id);t+=`• ${p.nom} : ${invMain(r)}${s?` (${s})`:''}\n`})});return t}

 return `<div class="head"><b>Le Pêcheur de l'Océan</b><span>${esc(title)}</span></div>${body}`}

 b.innerHTML=`<div class="sec"><div class="g3"><div><label for="f_num">N° ticket</label><input id="f_num" data-k="num" inputmode="numeric" value="${esc(o.num)}" ${ro}></div><div><label for="f_nom">Nom du client</label><input id="f_nom" data-k="nom" value="${esc(o.nom)}" autocapitalize="words" ${ro}></div><div><label for="f_tel">Téléphone</label><input id="f_tel" data-k="tel" type="tel" inputmode="tel" value="${esc(o.tel)}" ${ro}></div></div>${dup?'<div class="warn">Attention : ce n° de ticket existe déjà.</div>':''}</div>
 <div class="sec"><span class="lbl">Jour de retrait</span><div class="days">${JOURS.map(j=>`<button type="button" data-fjour="${j.v}" class="${o.jour===j.v?'on':''}" ${ro}><small>${j.d}</small>${j.n}</button>`).join('')}</div>
 <div class="g2"><div><label for="f_h">Heure prévue</label><input id="f_h" data-k="heure" type="time" step="900" value="${esc(o.heure)}" ${ro}></div><div><span class="lbl">Préparation</span><div class="seg plat">${Object.keys(MODES).map(m=>`<button type="button" data-fmode="${m}" class="${o.mode===m?'on':''}" ${ro}>${MODES[m]}</button>`).join('')}</div></div></div></div>
 <div class="sec"><span class="lbl">Contenu · ${o.lignes.length} produit${o.lignes.length>1?'s':''}</span>
 ${o.lignes.length?`<div class="lines">${o.lignes.map((l,i)=>lineHTML(l,i,ro)).join('')}</div>`:'<div class="empty" style="padding:16px">Ajoute les produits ci-dessous.</div>'}
 ${canWrite?`<div class="adder"><div class="chips">${CATS.map(c=>`<button type="button" class="chip light ${formCat===c?'on':''}" data-fcat="${c}">${c}</button>`).join('')}</div>
 <div class="pchips">${plist().filter(p=>p.cat===formCat).map(p=>`<button type="button" data-addl="${p.id}" class="${inForm.has(p.id)?'has':''}">+ ${esc(p.nom)}</button>`).join('')||'<span class="sub" style="margin:0">Aucun produit dans cette catégorie.</span>'}</div></div>`:''}</div>
 <div class="sec"><span class="lbl">Paiement</span><div class="g2"><div><label for="f_ac">Acompte versé (€)</label><input id="f_ac" data-k="acompte" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(o.acompte)}" ${ro}></div>
 <div><span class="lbl">&nbsp;</span><label class="tog">Déjà tout payé<input type="checkbox" data-k="paye" ${o.paye?'checked':''} ${ro}></label></div></div>
 <label class="tog">Consigne sur le plateau<input type="checkbox" data-k="consigne" ${o.consigne?'checked':''} ${ro}></label>
 ${o.consigne?`<div><label for="f_cm">Montant de la consigne (€)</label><input id="f_cm" data-k="consigneMontant" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(o.consigneMontant)}" ${ro}></div>`:''}
 <div class="sumbox" id="sumbox"></div></div>
 <div class="sec"><label for="f_n">Remarque</label><textarea id="f_n" data-k="notes" rows="2" ${ro} placeholder="Ex. homard 1 kg, huîtres ouvertes, rapporte son plateau inox…">${esc(o.notes)}</textarea></div>
 <div class="sec"><span class="lbl">Statut</span><div class="seg">${Object.keys(ST).map(s=>`<button type="button" data-fstat="${s}" class="${o.statut===s?'on':''}" ${ro}>${ST[s]}</button>`).join('')}</div></div>
 ${o.tel||o.id?`<div class="row">${o.tel?`<a class="btn out sm" href="tel:${esc(o.tel.replace(/\s/g,''))}">${ic('phone')}Appeler</a><a class="btn out sm" href="sms:${esc(o.tel.replace(/\s/g,''))}?&body=${encodeURIComponent(`Bonjour ${o.nom}, votre commande est prête au Pêcheur de l'Océan. À tout à l'heure !`)}">${ic('msg')}SMS « commande prête »</a>`:''}${o.id&&canWrite?`<button type="button" class="btn danger sm" data-delo style="margin-left:auto">${ic('trash')}Supprimer</button>`:''}</div>`:''}`;
 b.scrollTop=sc;$('#dSave').style.display=canWrite?'':'none';refreshSums()}
function lineHTML(l,i,ro){const us=unitsOf(l.pid);if(!us.includes(l.unite))us.push(l.unite);const p=prods[l.pid];
 return `<div class="ln" data-li="${i}"><div class="nm">${esc(pname(l))}<small id="ls${i}">${lineSub(l)}</small></div>
 <div class="step"><button type="button" data-dec="${i}" ${ro} aria-label="Moins">−</button><input data-qi="${i}" inputmode="decimal" value="${String(l.qte).replace('.',',')}" ${ro} aria-label="Quantité">${us.length>1?`<select data-ui="${i}" ${ro} aria-label="Unité">${us.map(u=>`<option value="${u}" ${u===l.unite?'selected':''}>${UL[u]}</option>`).join('')}</select>`:`<span class="u">${UL[l.unite]}</span>`}<button type="button" data-inc="${i}" ${ro} aria-label="Plus">+</button></div>
 ${canWrite?`<button type="button" class="x" data-rml="${i}" aria-label="Retirer">${ic('trash')}</button>`:'<span></span>'}</div>`}
function lineSub(l){const s=[prods[l.pid]?.cat||''];const g=grams(l);if(l.unite==='dz')s.push(nf(l.qte*12,0)+' huîtres');else if(l.unite!=='g'&&g!=null)s.push('≈ '+kgs(g));const pr=linePrice(l);if(pr!=null)s.push(eur(pr));return s.filter(Boolean).join(' · ')}
function refreshSums(){if(!edit)return;const t=totals(edit),sb=$('#sumbox');
 if(sb)sb.innerHTML=`<div><span>Total produits</span><b class="num">${!t.n?'—':t.miss?'prix à compléter':eur(t.t)}</b></div>${t.cons?`<div><span>Consigne</span><span class="num">${eur(t.cons)}</span></div>`:''}${t.ac?`<div><span>Acompte</span><span class="num">− ${eur(t.ac)}</span></div>`:''}<div class="tt"><span>Reste à payer</span><span class="num">${t.paid?'Payé':!t.n||t.miss?'—':eur(t.reste)}</span></div>${t.miss&&t.n?`<div class="warn">${t.miss} produit(s) sans prix ou sans poids dans le catalogue.</div>`:''}`;
 const known=t.n&&!t.miss;$('#dTotL').textContent=t.paid?'Paiement':known?'Reste à payer':t.ac?'Acompte versé':'Total';$('#dTot').textContent=t.paid?'Déjà payé':known?eur(t.reste):t.ac?eur(t.ac):t.n?'Prix à compléter':'—';
 edit.lignes.forEach((l,i)=>{const e=$('#ls'+i);if(e)e.textContent=lineSub(l)})}
function bump(i,dir){const l=edit.lignes[i];const s=STEP[l.unite]||1;l.qte=Math.max(0,Math.round(((+l.qte||0)+dir*s)*100)/100);const inp=$(`[data-qi="${i}"]`);if(inp)inp.value=String(l.qte).replace('.',',');dirty=true;refreshSums()}

/* écritures */
const col=c=>({doc:id=>doc(fs,c,id)});
function clean(o){const d={...o};delete d.id;d.num=String(d.num).trim();d.nom=d.nom.trim();d.tel=(d.tel||'').trim();
 d.lignes=(d.lignes||[]).filter(l=>l.pid&&+l.qte>0).map(l=>({pid:l.pid,nom:pname(l),qte:+l.qte,unite:l.unite}));
 d.acompte=+String(d.acompte).replace(',','.')||0;d.consigneMontant=+String(d.consigneMontant).replace(',','.')||0;d.paye=!!d.paye;d.consigne=!!d.consigne;d.maj=new Date().toISOString();return d}
function save(){const o=edit;if(!fs)return;
 if(!String(o.num).trim()||!String(o.nom).trim()){toast('Il faut au moins le n° du ticket et le nom');return}
 const d=clean(o);(o.id?setDoc(doc(fs,'commandes',o.id),d):(d.cree=d.maj,addDoc(collection(fs,'commandes'),d))).catch(fail);
 closeForm(true);toast(navigator.onLine?'Commande enregistrée':'Enregistrée sur cet appareil, envoi au retour du réseau')}
function setStatus(id,s){updateDoc(doc(fs,'commandes',id),{statut:s,maj:new Date().toISOString()}).catch(fail)}
function fail(e){console.error(e);toast(e?.code==='permission-denied'?'Accès refusé : reconnecte-toi':e?.code==='resource-exhausted'?'Limite gratuite du jour atteinte':'Échec de l\'enregistrement, réessaie')}
function confirmDlg(txt,lbl,ok){$('#dlg').innerHTML=`<b>${esc(txt)}</b><div class="row" style="justify-content:flex-end"><button class="btn out" data-no>Annuler</button><button class="btn pri" data-yes>${esc(lbl)}</button></div>`;$('#dlgw').classList.add('open');
 $('#dlg').onclick=e=>{if(e.target.closest('[data-no]'))$('#dlgw').classList.remove('open');if(e.target.closest('[data-yes]')){$('#dlgw').classList.remove('open');ok()}}}
function saveProd(row){const id=row.dataset.pid,p=prods[id];if(!p)return;const v=f=>row.querySelector(`[data-f=${f}]`).value;
 const d={...p,nom:v('nom').trim()||p.nom,prix:+String(v('prix')).replace(',','.')||0,prixPar:v('prixPar'),poidsPc:+v('poidsPc')||0,unites:$$(`[data-pid="${id}"] [data-tu].on`).map(b=>b.dataset.tu)};
 if(JSON.stringify(d)===JSON.stringify(p))return;setDoc(doc(fs,'produits',id),d).catch(fail);toast('Produit enregistré')}
function importCat(replace){const bt=writeBatch(fs);let n=0;
 if(replace)OLD_IDS.filter(id=>prods[id]).forEach(id=>bt.delete(doc(fs,'produits',id)));
 SEED.forEach(([id,nom,cat,unites],i)=>{if(!prods[id]){bt.set(doc(fs,'produits',id),{nom,cat,unites,prix:0,prixPar:unites[0]==='dz'?'dz':'kg',poidsPc:0,ordre:i});n++}});
 bt.commit().then(()=>toast(`${n} produits importés`),fail)}

/* événements */
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-open]');if(!b)return;const d=b.dataset;
 if(d.next){const o=orders.find(x=>x.id===d.next);if(o)setStatus(o.id,{attente:'prepare',prepare:'retire',retire:'attente'}[o.statut]);return}
 if(d.open&&!e.target.closest('button:not([data-open]),a')){openForm(orders.find(o=>o.id===d.open));return}
 if(d.day){day=d.day;q='';render()}else if(d.pday){planDay=d.pday;render()}else if(d.prday){prepDay=d.prday;render()}else if(d.prtday){printDay=d.prtday;render()}
 else if(d.st){stat=d.st;render()}else if(d.mode){mode=d.mode;render()}else if(d.pmode){printMode=d.pmode;render()}
 else if('new' in d){openForm(null)}
 else if('close' in d){closeForm()}
 else if('logout' in d){confirmDlg('Se déconnecter de cet appareil ?','Déconnexion',()=>signOut(auth))}
 else if(d.fjour&&edit){edit.jour=d.fjour;dirty=true;drawForm()}
 else if(d.fmode&&edit){edit.mode=d.fmode;dirty=true;drawForm()}
 else if(d.fstat&&edit){edit.statut=d.fstat;dirty=true;drawForm()}
 else if(d.fcat&&edit){formCat=d.fcat;drawForm()}
 else if(d.addl&&edit){const i=edit.lignes.findIndex(l=>l.pid===d.addl);if(i>=0){bump(i,1);toast(`${prods[d.addl]?.nom} : ${fmtQ(edit.lignes[i].qte,edit.lignes[i].unite)}`)}else{const u=unitsOf(d.addl)[0];edit.lignes.push({pid:d.addl,qte:DEF[u],unite:u});dirty=true;drawForm()}}
 else if(d.inc!=null&&edit){bump(+d.inc,1)}else if(d.dec!=null&&edit){bump(+d.dec,-1)}
 else if(d.rml!=null&&edit){edit.lignes.splice(+d.rml,1);dirty=true;drawForm()}
 else if('delo' in d&&edit){const o=edit;confirmDlg(`Supprimer la commande n° ${o.num} (${o.nom}) ?`,'Supprimer',()=>{deleteDoc(doc(fs,'commandes',o.id)).catch(fail);closeForm(true);toast('Commande supprimée')})}
 else if(d.tu){b.classList.toggle('on');saveProd(b.closest('.prow'))}
 else if(d.addp){const id='p'+Date.now().toString(36);setDoc(doc(fs,'produits',id),{nom:'Nouveau produit',cat:d.addp,prix:0,prixPar:'kg',poidsPc:0,unites:['pc','g'],ordre:999}).catch(fail)}
 else if(d.delp){const p=prods[d.delp];confirmDlg(`Supprimer « ${p.nom} » du catalogue ?`,'Supprimer',()=>deleteDoc(doc(fs,'produits',d.delp)).catch(fail))}
 else if('import' in d){importCat(d.import==='replace')}
 else if('copyinv' in d){navigator.clipboard.writeText(invText(prepDay)).then(()=>toast('Liste copiée'),()=>toast('Copie impossible ici'))}
 else if(d.print){$('#printArea').innerHTML=printHTML(d.print);setTimeout(()=>window.print(),60)}
});
$('#scrim').addEventListener('click',()=>closeForm());
$('#drawer').addEventListener('submit',e=>{e.preventDefault();if(canWrite)save()});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){q=t.value;const p=t.selectionStart;render();const n=$('#q');n.focus();try{n.setSelectionRange(p,p)}catch(_){}return}
 if(!edit||!t.closest('#drawer'))return;dirty=true;
 if(t.dataset.qi!=null){edit.lignes[+t.dataset.qi].qte=+t.value.replace(',','.')||0;refreshSums();return}
 const k=t.dataset.k;if(!k)return;edit[k]=t.type==='checkbox'?t.checked:t.value;
 if(t.type==='checkbox')drawForm();else if(k==='acompte'||k==='consigneMontant')refreshSums()});
document.addEventListener('change',e=>{const t=e.target;
 if(edit&&t.dataset.ui!=null){edit.lignes[+t.dataset.ui].unite=t.value;dirty=true;drawForm();return}
 if(edit&&t.dataset.k==='num'){drawForm();return}
 const row=t.closest('.prow');if(row&&t.dataset.f)saveProd(row)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dlgw').classList.contains('open'))$('#dlgw').classList.remove('open');else if(edit)closeForm()}});
let pend=false;function soft(){const a=document.activeElement;if(a?.closest?.('#main .prow, #q')){pend=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend&&!document.activeElement?.closest?.('#main .prow, #q')){pend=false;render()}},0));
function route(){const h=location.hash.slice(1);view=VIEWS.some(v=>v.id===h)?h:'commandes';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);buildNav();

/* Firebase */
function listen(){unsubs.forEach(u=>u());const off={p:true,o:true};
 const st=()=>off.p||off.o?sync('',navigator.onLine?'Synchronisation…':'Hors ligne · envoi au retour du réseau'):sync('on','Synchronisé');
 const err=e=>{fail(e);sync('off',e.code==='permission-denied'?'Accès refusé':'Connexion perdue, recharge la page')};
 unsubs=[onSnapshot(collection(fs,'produits'),{includeMetadataChanges:true},s=>{prods={};s.docs.forEach(d=>prods[d.id]=d.data());loaded.p=true;off.p=s.metadata.fromCache;st();if(edit)drawForm();soft()},err),
 onSnapshot(collection(fs,'commandes'),{includeMetadataChanges:true},s=>{orders=s.docs.map(d=>({id:d.id,...d.data()})).map(o=>({...o,statut:o.statut||'attente',mode:o.mode||'PLATEAU',lignes:o.lignes||[]}));loaded.o=true;off.o=s.metadata.fromCache;st();soft()},err)]}
addEventListener('offline',()=>sync('','Hors ligne · envoi au retour du réseau'));addEventListener('online',()=>sync('','Synchronisation…'));
if(!FIREBASE_CONFIG?.apiKey||FIREBASE_CONFIG.apiKey.startsWith('A_REMPLIR')){route();sync('off','Firebase non configuré');$('#main').innerHTML='<div class="empty"><b>Site pas encore relié à Firebase</b>Remplis firebase-config.js.</div>'}
else{
 const app=initializeApp(FIREBASE_CONFIG);fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
 auth=getAuth(app);setPersistence(auth,browserLocalPersistence).catch(()=>{});route();
 onAuthStateChanged(auth,u=>{$('#login').classList.toggle('open',!u);$$('[data-logout]').forEach(b=>b.hidden=!u);
  if(u){listen()}else{unsubs.forEach(x=>x());unsubs=[];orders=[];prods={};loaded={p:false,o:false};sync('','Non connecté');render()}});
 $('#loginForm').addEventListener('submit',e=>{e.preventDefault();const er=$('#loginErr');er.textContent='';
  signInWithEmailAndPassword(auth,$('#l_mail').value.trim(),$('#l_pw').value).catch(x=>{er.textContent=/invalid|wrong|not-found/.test(x.code)?'E-mail ou mot de passe incorrect':x.code==='auth/too-many-requests'?'Trop d\'essais, patiente un peu':x.code==='auth/network-request-failed'?'Pas de réseau':'Connexion impossible ('+x.code+')'})});
}
}
</script>
</body>
</html>
